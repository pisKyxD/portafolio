  <!-- mi escudo como icono de la pestaña -->

  <!-- fuentes: Cinzel para los titulos con onda medieval e Inter para que el texto se lea bien -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- estilos de la pantalla de carga. van aca y no en styles.css porque tienen que verse
       antes de que cargue angular (si no, se veria la pagina en negro mientras carga) -->
  <style>
    #cargando {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background-color: #14110f;
      background-image:
        radial-gradient(circle at 50% 42%, rgba(201, 162, 74, 0.14), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(79, 138, 95, 0.12), transparent 50%);
      color: #ece4d4;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      /* por si algo falla y angular nunca la saca, se esconde sola a los 10 segundos */
      animation: cargando-ocultar 0.6s ease 10s forwards;
    }

    /* angular le pone esta clase cuando la pagina ya esta lista y se desvanece */
    #cargando.listo {
      opacity: 0;
      visibility: hidden;
    }

    /* el escudo flota despacito con un brillo dorado detras, como una antorcha */
    #cargando .escudo {
      position: relative;
      width: 96px;
      animation: cargando-flotar 2.4s ease-in-out infinite;
    }

    #cargando .escudo img {
      display: block;
      width: 100%;
      filter: drop-shadow(0 0 18px rgba(201, 162, 74, 0.35));
      animation: cargando-brillo 2.4s ease-in-out infinite;
    }

    #cargando .nombre {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #e6c56f;
    }

    /* la "espada": una linea dorada con un destello que la recorre una y otra vez */
    #cargando .espada {
      position: relative;
      width: 180px;
      height: 3px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(201, 162, 74, 0.25);
    }

    #cargando .espada::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #e6c56f, transparent);
      animation: cargando-destello 1.3s ease-in-out infinite;
    }

    #cargando .frase {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: #a89f8f;
    }

    /* chispas que suben desde abajo, como de una fragua */
    #cargando .chispa {
      position: absolute;
      bottom: -10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e6c56f;
      box-shadow: 0 0 8px #c9a24a;
      opacity: 0;
      animation: cargando-chispa 3.2s linear infinite;
    }

    #cargando .chispa:nth-child(1) { left: 20%; animation-delay: 0s; }
    #cargando .chispa:nth-child(2) { left: 38%; animation-delay: 1.1s; }
    #cargando .chispa:nth-child(3) { left: 55%; animation-delay: 0.5s; }
    #cargando .chispa:nth-child(4) { left: 70%; animation-delay: 1.8s; }
    #cargando .chispa:nth-child(5) { left: 85%; animation-delay: 2.4s; }

    @keyframes cargando-flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes cargando-brillo {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(201, 162, 74, 0.25)); }
      50% { filter: drop-shadow(0 0 26px rgba(230, 197, 111, 0.55)); }
    }

    @keyframes cargando-destello {
      to { left: 100%; }
    }

    @keyframes cargando-chispa {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-70vh); opacity: 0; }
    }

    @keyframes cargando-ocultar {
      to { opacity: 0; visibility: hidden; }
    }

    /* si la persona tiene desactivadas las animaciones en su sistema, todo queda quieto */
    @media (prefers-reduced-motion: reduce) {
      #cargando .escudo,
      #cargando .escudo img,
      #cargando .espada::after,
      #cargando .chispa {
        animation: none;
      }
      #cargando .chispa { display: none; }
    }
  </style>
</head>
<body>
  <!-- pantalla de carga: se ve apenas abre la pagina y angular la desvanece cuando termina de cargar -->
  <div id="cargando" role="status" aria-label="Cargando el portafolio">
    <span class="chispa"></span>
    <span class="chispa"></span>
    <span class="chispa"></span>
    <span class="chispa"></span>
    <span class="chispa"></span>
    <div class="escudo"><img src="escudo.svg" alt="" width="96" height="115"></div>
    <p class="nombre">PISKY</p>
    <div class="espada"></div>
    <p class="frase">Forjando el reino...</p>
  </div>

  <app-root></app-root>
</body>
</html>
