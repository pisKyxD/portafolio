<div class="guia" [class.cerrado]="!abierto()">
  @if (abierto()) {
    <div class="globo">
      <div class="globo-cabecera">
        <span class="nombre">{{ nombre }}</span>
        <button class="cerrar" (click)="alternar()" aria-label="Ocultar guía">×</button>
      </div>

      <p class="texto" aria-live="polite">
        {{ texto() }}<span class="cursor" [class.oculto]="!escribiendo()">|</span>
      </p>

      @if (modo() === 'dialogo') {
        <div class="botones">
          <button class="secundario" (click)="abrirPregunta()">Pregúntame</button>
          <button class="siguiente" (click)="siguiente()">
            {{ escribiendo() ? 'Saltar' : 'Siguiente ▸' }}
          </button>
        </div>
      } @else {
        <!-- formulario para hacerle preguntas a la IA -->
        <form class="formulario" (submit)="enviarPregunta($event)">
          <input
            #campo
            type="text"
            [value]="pregunta()"
            (input)="actualizarPregunta($event)"
            maxlength="300"
            placeholder="Ej: ¿Qué hizo en VidalStore?"
            [disabled]="pensando()"
            aria-label="Tu pregunta para Sir Bit"
          />
          <button type="submit" class="siguiente" [disabled]="pensando() || !pregunta().trim()">
            {{ pensando() ? '...' : 'Enviar' }}
          </button>
        </form>
        <button class="volver" (click)="volverDialogos()">◂ Volver al recorrido</button>
      }
    </div>
  }

  <button
    class="personaje"
    (click)="clicPersonaje()"
    [attr.aria-label]="abierto() ? 'Interactuar con ' + nombre : 'Hablar con ' + nombre"
  >
    <!-- el caballero, se anima moviendo el fondo cuadro por cuadro -->
    <div
      class="sprite"
      [class.listo]="spriteListo()"
      [style.width.px]="anchoCuadro"
      [style.height.px]="altoCuadro"
      [style.background-image]="'url(' + archivoActual() + ')'"
      [style.background-position]="posicionFondo()"
      [style.background-size]="tamanoHoja()"
    ></div>
  </button>
</div>
